[tool.poetry]
name = "pylocator"
version = "1.0.0"
description = "EEG electrode localisation in MRI/CT volumes"
authors = ["Thorsten Kranz"]
license = "BSD-2-Clause"

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26"
nibabel = "^5.2"
vtk = "^9.3"
PySide6 = "^6.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
